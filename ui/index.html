<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solstice Pilates — AI Receptionist</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f0eb;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 680px;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    header h1 { font-size: 1.4rem; color: #2d3a2e; font-weight: 600; }
    header p  { font-size: 0.85rem; color: #7a8c7b; margin-top: 0.25rem; }

    #chat-window {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
      height: 520px;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .bubble {
      max-width: 80%;
      padding: 0.65rem 1rem;
      border-radius: 18px;
      font-size: 0.93rem;
      line-height: 1.45;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .bubble.user {
      align-self: flex-end;
      background: #3d6b45;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bubble.agent {
      align-self: flex-start;
      background: #eef4ee;
      color: #2d3a2e;
      border-bottom-left-radius: 4px;
    }
    .bubble.system {
      align-self: center;
      background: transparent;
      color: #aaa;
      font-size: 0.78rem;
      font-style: italic;
    }

    #input-row {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    #user-input {
      flex: 1;
      padding: 0.7rem 1rem;
      border: 1.5px solid #c8d6c9;
      border-radius: 8px;
      font-size: 0.93rem;
      outline: none;
      transition: border-color .2s;
    }
    #user-input:focus { border-color: #3d6b45; }

    #send-btn {
      padding: 0.7rem 1.4rem;
      background: #3d6b45;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.93rem;
      cursor: pointer;
      transition: background .2s;
    }
    #send-btn:hover { background: #2f5236; }
    #send-btn:disabled { background: #9db89f; cursor: not-allowed; }

    #session-info {
      font-size: 0.75rem;
      color: #aaa;
      text-align: right;
      margin-top: 0.4rem;
    }

    .typing-indicator {
      align-self: flex-start;
      display: flex;
      gap: 4px;
      padding: 0.6rem 0.9rem;
      background: #eef4ee;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
    }
    .typing-indicator span {
      width: 7px;
      height: 7px;
      background: #7a8c7b;
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>Solstice Pilates</h1>
    <p>AI Receptionist — Phase 1 Chat Demo</p>
  </header>

  <div id="chat-window"></div>
  <div id="session-info">No active session</div>

  <div id="input-row">
    <input id="user-input" type="text" placeholder="Type your message…" autocomplete="off"/>
    <button id="send-btn">Send</button>
  </div>
</div>

<script>
  const API = '';  // same origin

  let sessionId = null;
  const chatWindow = document.getElementById('chat-window');
  const input = document.getElementById('user-input');
  const btn = document.getElementById('send-btn');
  const sessionInfo = document.getElementById('session-info');

  function addBubble(role, text) {
    const div = document.createElement('div');
    div.className = `bubble ${role}`;
    div.textContent = text;
    chatWindow.appendChild(div);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return div;
  }

  function showTyping() {
    const el = document.createElement('div');
    el.className = 'typing-indicator';
    el.id = 'typing';
    el.innerHTML = '<span></span><span></span><span></span>';
    chatWindow.appendChild(el);
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typing');
    if (el) el.remove();
  }

  async function initSession() {
    const res = await fetch(`${API}/session`, { method: 'POST' });
    const data = await res.json();
    sessionId = data.session_id;
    sessionInfo.textContent = `Session: ${sessionId.slice(0, 8)}…`;
    addBubble('agent', 'Hi there! Thanks for calling Solstice Pilates. How can I help you today?');
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    btn.disabled = true;
    addBubble('user', text);
    showTyping();

    try {
      const res = await fetch(`${API}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, message: text }),
      });
      const data = await res.json();
      hideTyping();
      if (data.reply) {
        sessionId = data.session_id;
        addBubble('agent', data.reply);
      } else {
        addBubble('system', 'No response received.');
      }
    } catch (err) {
      hideTyping();
      addBubble('system', 'Connection error. Please try again.');
    } finally {
      btn.disabled = false;
      input.focus();
    }
  }

  btn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) sendMessage(); });

  // Boot
  initSession().catch(err => addBubble('system', `Failed to start session: ${err.message}`));
</script>
</body>
</html>
